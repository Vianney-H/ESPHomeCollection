substitutions:
  name: "esp32s3-touch-display"
  friendly_name: "Écran ES3C28P"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - component.update: cam_jardin_img

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: spi_bus
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

i2c:
  - id: i2c_bus
    scl: GPIO15
    sda: GPIO16
    scan: true
    frequency: 400kHz

logger:
  hardware_uart: USB_CDC

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32S3 Touch Display Fallback"
    password: !secret wifi_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

time:
  - platform: homeassistant
    id: ha_time

web_server:
  port: 80

http_request:
  id: ha_http_request
  timeout: 5s

output:
  - id: display_backlight
    platform: ledc
    pin: GPIO45

light:
  - id: display_backlight_light
    platform: monochromatic
    name: Display Backlight
    icon: "mdi:television"
    entity_category: config
    output: display_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0ms

  - id: status_led
    platform: esp32_rmt_led_strip
    name: Status LED
    pin: GPIO42
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812

switch:
  - id: enable_speaker_amp
    platform: gpio
    name: Enable Speaker
    pin:
      number: GPIO1
      inverted: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true

button:
  - platform: restart
    name: "Redémarrer Écran"

display:
  - id: main_display
    platform: ili9xxx
    model: ILI9341
    spi_id: spi_bus
    cs_pin: GPIO10
    dc_pin: GPIO46
    invert_colors: true
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - id: main_touchscreen
    platform: ft63x6
    i2c_id: i2c_bus
    display: main_display
    interrupt_pin: GPIO17
    reset_pin: GPIO18

i2s_audio:
  - id: i2s_audio_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO7

audio_dac:
  - id: es8311_dac
    platform: es8311
    i2c_id: i2c_bus
    use_microphone: true
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - id: main_microphone
    platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO6
    adc_type: external
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - id: main_speaker
    platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: mono

media_player:
  - platform: speaker
    id: es3c28p_media_player
    name: "Haut-parleur"
    announcement_pipeline:
      speaker: main_speaker

binary_sensor:
  - platform: status
    name: "État ESP32"
  - platform: touchscreen
    id: touch_sensor
    name: "Écran Touché"
    touchscreen_id: main_touchscreen
    x_min: 0
    x_max: 320
    y_min: 0
    y_max: 240
    on_press:
      - light.turn_on:
          id: display_backlight_light
          brightness: 80%
      - script.execute: screen_dim_timer

script:
  - id: screen_dim_timer
    mode: restart
    then:
      - delay: 30s
      - light.turn_off: display_backlight_light

sensor:
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 60s
  - platform: uptime
    name: "Temps d'activité"
  - platform: homeassistant
    id: temp_salon
    entity_id: sensor.temperature_salon
  - platform: internal_temperature
    name: "Température ESP32"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
    ssid:
      name: "SSID Wi‑Fi"
    bssid:
      name: "BSSID Wi‑Fi"

voice_assistant:
  microphone: main_microphone
  speaker: main_speaker
  on_listening:
    - logger.log: "En écoute..."
  on_tts_start:
    - logger.log: "Parle..."
  on_end:
    - logger.log: "Prêt"

globals:
  - id: active_camera
    type: int
    restore_value: no
    initial_value: '1'

online_image:
  - id: cam_jardin_img
    url: "http://192.168.1.193:5000/api/jardin/latest.jpg"
    format: JPEG
    type: RGB565
    resize: 320x180
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: img_jardin
          src: cam_jardin_img

  - id: cam_mangeoire_img
    url: "http://192.168.1.193:5000/api/mangeoire/latest.jpg"
    format: JPEG
    type: RGB565
    resize: 320x180
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: img_mangeoire
          src: cam_mangeoire_img

  - id: cam_herisson_img
    url: "http://192.168.1.193:5000/api/herisson/latest.jpg"
    format: JPEG
    type: RGB565
    resize: 320x180
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: img_herisson
          src: cam_herisson_img

interval:
  - interval: 4s
    then:
      - lambda: |-
          if (id(active_camera) == 1) {
            id(cam_jardin_img).update();
          } else if (id(active_camera) == 2) {
            id(cam_mangeoire_img).update();
          } else if (id(active_camera) == 3) {
            id(cam_herisson_img).update();
          }

lvgl:
  rotation: 90
  displays:
    - main_display
  touchscreens:
    - main_touchscreen

  style_definitions:
    - id: style_btn_idle
      bg_color: 0x1E293B
      text_color: 0x94A3B8
      radius: 6
      pad_all: 2
      border_width: 0
    - id: style_btn_active
      bg_color: 0x2563EB
      text_color: 0xFFFFFF
      radius: 6
      pad_all: 2
      border_width: 0

  widgets:
    - obj:
        id: screen_cameras
        x: 0
        y: 0
        width: 320
        height: 240
        bg_color: 0x0F172A
        border_width: 0
        pad_all: 0
        scrollable: false
        scrollbar_mode: "OFF"
        widgets:
          - obj:
              id: button_bar
              x: 0
              y: 0
              width: 320
              height: 44
              bg_color: 0x0F172A
              border_width: 0
              pad_all: 0
              scrollable: false
              scrollbar_mode: "OFF"
              widgets:
                - button:
                    id: btn_c1
                    x: 0
                    y: 0
                    width: 106
                    height: 44
                    styles: style_btn_active
                    widgets:
                      - label: { text: "Jardin", align: CENTER }
                    on_click:
                      - globals.set: { id: active_camera, value: '1' }
                      - component.update: cam_jardin_img
                      - lvgl.widget.show: img_jardin
                      - lvgl.widget.hide: img_mangeoire
                      - lvgl.widget.hide: img_herisson
                      - lvgl.widget.update: { id: btn_c1, styles: style_btn_active }
                      - lvgl.widget.update: { id: btn_c2, styles: style_btn_idle }
                      - lvgl.widget.update: { id: btn_c3, styles: style_btn_idle }

                - button:
                    id: btn_c2
                    x: 107
                    y: 0
                    width: 106
                    height: 44
                    styles: style_btn_idle
                    widgets:
                      - label: { text: "Oiseaux", align: CENTER }
                    on_click:
                      - globals.set: { id: active_camera, value: '2' }
                      - component.update: cam_mangeoire_img
                      - lvgl.widget.hide: img_jardin
                      - lvgl.widget.show: img_mangeoire
                      - lvgl.widget.hide: img_herisson
                      - lvgl.widget.update: { id: btn_c1, styles: style_btn_idle }
                      - lvgl.widget.update: { id: btn_c2, styles: style_btn_active }
                      - lvgl.widget.update: { id: btn_c3, styles: style_btn_idle }

                - button:
                    id: btn_c3
                    x: 214
                    y: 0
                    width: 106
                    height: 44
                    styles: style_btn_idle
                    widgets:
                      - label: { text: "Herisson", align: CENTER }
                    on_click:
                      - globals.set: { id: active_camera, value: '3' }
                      - component.update: cam_herisson_img
                      - lvgl.widget.hide: img_jardin
                      - lvgl.widget.hide: img_mangeoire
                      - lvgl.widget.show: img_herisson
                      - lvgl.widget.update: { id: btn_c1, styles: style_btn_idle }
                      - lvgl.widget.update: { id: btn_c2, styles: style_btn_idle }
                      - lvgl.widget.update: { id: btn_c3, styles: style_btn_active }

          - image:
              id: img_jardin
              x: 0
              y: 44
              width: 320
              height: 180
              src: cam_jardin_img

          - image:
              id: img_mangeoire
              x: 0
              y: 44
              width: 320
              height: 180
              src: cam_mangeoire_img
              hidden: true

          - image:
              id: img_herisson
              x: 0
              y: 44
              width: 320
              height: 180
              src: cam_herisson_img
              hidden: true
